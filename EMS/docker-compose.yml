# ============================================================
# QuickEMS — Docker Compose (Production)
# Runs: MongoDB + Express API Server + React Client (Nginx)
# Usage: docker-compose up --build
# ============================================================

version: "3.9"

services:
  # ─────────────────────────────────────────
  # MongoDB Database
  # ─────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: ems-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: fullstack-ems
    volumes:
      - mongo_data:/data/db
    networks:
      - ems-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────
  # Express API Server
  # ─────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: ../docker/Dockerfile.server
    container_name: ems-server
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    environment:
      # Override MongoDB URI to use the Docker service name
      MONGODB_URI: mongodb://mongo:27017/fullstack-ems
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - ems-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─────────────────────────────────────────
  # React Client (Nginx)
  # ─────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: ../docker/Dockerfile.client
    container_name: ems-client
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      VITE_BASE_URL: http://localhost:4000
    depends_on:
      server:
        condition: service_healthy
    networks:
      - ems-network

# ─────────────────────────────────────────
# Named Volumes (persistent data)
# ─────────────────────────────────────────
volumes:
  mongo_data:
    name: ems-mongo-data

# ─────────────────────────────────────────
# Internal Network
# ─────────────────────────────────────────
networks:
  ems-network:
    name: ems-network
    driver: bridge
