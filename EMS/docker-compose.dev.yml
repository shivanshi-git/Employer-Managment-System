# ============================================================
# QuickEMS — Docker Compose Dev Override
# Adds hot-reload via volume mounts on top of docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# ============================================================

version: "3.9"

services:
  server:
    # Override the production command with nodemon for hot-reload
    command: npx nodemon server.js
    environment:
      NODE_ENV: development
    volumes:
      # Mount source for hot-reload (skips node_modules)
      - ./server:/app
      - /app/node_modules
    ports:
      - "4000:4000"

  client:
    # In dev, run Vite dev server instead of Nginx
    build:
      context: ./client
      dockerfile: ../docker/Dockerfile.client.dev
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_BASE_URL: http://localhost:4000
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
