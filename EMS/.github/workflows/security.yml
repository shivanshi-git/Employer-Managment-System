name: Weekly Security Audit

on:
  # Run every Monday at 08:00 UTC
  schedule:
    - cron: "0 8 * * 1"
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  security-audit:
    name: 🔐 Dependency Security Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [client, server]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.workspace }}
        run: npm ci

      - name: Run npm audit
        id: audit
        working-directory: ${{ matrix.workspace }}
        run: |
          npm audit --json > audit-report.json || true
          echo "## 📦 ${{ matrix.workspace }} — Security Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          npm audit --audit-level=moderate 2>&1 | tail -20 >> $GITHUB_STEP_SUMMARY

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-${{ matrix.workspace }}
          path: ${{ matrix.workspace }}/audit-report.json
          retention-days: 30

      - name: Fail on high severity vulnerabilities
        working-directory: ${{ matrix.workspace }}
        run: npm audit --audit-level=high
