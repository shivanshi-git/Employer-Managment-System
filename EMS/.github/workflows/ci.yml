name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs for the same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: Lint & Security Audit
  # ──────────────────────────────────────────────────────────
  lint-and-audit:
    name: 🔍 Lint & Security Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [client, server]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.workspace }}
        run: npm ci

      - name: Run ESLint (client only)
        if: matrix.workspace == 'client'
        working-directory: client
        run: npm run lint

      - name: Security audit
        working-directory: ${{ matrix.workspace }}
        # Fail CI if high-severity vulnerabilities are found
        run: npm audit --audit-level=high
        continue-on-error: false

  # ──────────────────────────────────────────────────────────
  # Job 2: Docker Build Validation
  # ──────────────────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-audit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./docker/Dockerfile.server
          push: false
          tags: ems-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build client Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./docker/Dockerfile.client
          push: false
          tags: ems-client:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────
  # Job 3: Deploy to Vercel (only on push to main/master)
  # ──────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [lint-and-audit, docker-build]
    # Only deploy on direct pushes to main/master, not PRs
    if: github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy Server to Vercel
        working-directory: server
        run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_SERVER_PROJECT_ID }}

      - name: Deploy Client to Vercel
        working-directory: client
        run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CLIENT_PROJECT_ID }}
